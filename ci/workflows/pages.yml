# To enable: copy this file to .github/workflows/ and set Settings > Pages > Source to "GitHub Actions".
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the PWA files are present
        run: |
          for f in index.html manifest.json sw.js config.js icons/icon-192.png icons/icon-512.png icons/maskable-512.png icons/apple-touch-icon.png; do
            test -f "public/$f" || { echo "missing public/$f"; exit 1; }
          done
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
