# To enable: copy this file to .github/workflows/ (needs a token/user allowed to edit workflows).
name: Build Android APK

# Push a tag like v1.0.0 to build the APK and attach it to a GitHub Release.
# Can also be started by hand from the Actions tab (the APK is then saved as a run artifact).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor
    env:
      APK_NAME: casper-lost-dogs-debug.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the web app into the Android project
        run: |
          npm run prepare-web
          npx cap add android
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION_NAME="0.0.${GITHUB_RUN_NUMBER}-dev"
          VERSION_NAME="$VERSION_NAME" VERSION_CODE="${GITHUB_RUN_NUMBER}" ./configure-android.sh
          npx cap sync android

      - name: Build debug APK
        working-directory: capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$APK_NAME"
          ls -la "$GITHUB_WORKSPACE/$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: casper-lost-dogs-apk
          path: ${{ env.APK_NAME }}

      - name: Attach APK to the GitHub Release
        if: github.ref_type == 'tag'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Android app (debug build). On your Android phone: tap $APK_NAME below to download, open it, and allow \"Install unknown apps\" for your browser if asked. iPhone: open https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/ in Safari, then Share > Add to Home Screen."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_NAME" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_NAME" --title "Casper Lost Dogs $GITHUB_REF_NAME" --notes "$NOTES"
          fi
